name: Build og test

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: dotnet restore

      # Advarsler er ikke feil her ennå — repoet har TODO-er som skal stå. Skal dere
      # stramme inn senere, er det -warnaserror på denne linjen.
      - run: dotnet build --no-restore --configuration Release

      # Testene trenger verken database eller nettverk: de kjører mot EF sin
      # in-memory-provider og et testskjema for innlogging. Se
      # tests/StartPraksisGruppe3Prosjekt.Tests/StartCompassFactory.cs.
      #
      # Databasepassordet er en hemmelighet og ligger ikke her. Appen starter ikke uten
      # det, men testverten setter en dummy-verdi selv nettopp fordi den aldri kobler til.
      - run: dotnet test --no-build --configuration Release --verbosity normal
